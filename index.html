<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>温泉データベース</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="brand"><span>♨</span><div><b>温泉データベース</b><small>みんなでつくる温泉情報</small></div></div><button id="add">＋ 温泉を追加</button></header>
<section class="hero"><h1>行きたい温泉を探そう</h1><p>全国の温泉施設を、みんなで記録・共有。</p><input id="search" placeholder="温泉名・地域で検索"></section>
<main><div class="title"><h2>温泉一覧</h2><span id="count"></span></div><div id="cards"></div></main>
<div id="modal" class="hidden" aria-hidden="true">
<div class="dialog" role="dialog" aria-modal="true"><button id="close" class="close" type="button">×</button>
<div class="modal-head"><span class="modal-icon">♨</span><div><h2>温泉を追加</h2><p>分かる項目だけ入力できます。</p></div></div>
<form id="form">
        <section class="form-section">
          <h3>基本情報</h3>
          <div class="grid two">
            <label>温泉名 *
              <input id="name" required maxlength="100" placeholder="例：○○温泉">
            </label>
            <label>施設業態
              <select id="businessType">
                <option value="">選択してください</option>
                <option value="日帰り温泉">日帰り温泉</option>
                <option value="温泉旅館">温泉旅館</option>
                <option value="ホテル">ホテル</option>
                <option value="スーパー銭湯">スーパー銭湯</option>
                <option value="共同浴場">共同浴場</option>
                <option value="その他">その他</option>
              </select>
            </label>
            <label>都道府県
              <input id="prefecture" maxlength="20" placeholder="例：群馬県">
            </label>
            <label>市区町村
              <input id="city" maxlength="50" placeholder="例：吾妻郡草津町">
            </label>
            <label class="full">住所
              <input id="address" maxlength="150" placeholder="例：○○町○○番地">
            </label>
            <label>電話番号
              <input id="phone" type="tel" maxlength="30" placeholder="例：0279-00-0000">
            </label>
            <label>公式サイト
              <input id="website" type="url" maxlength="300" placeholder="https://...">
            </label>
          </div>
        </section>

        <section class="form-section">
          <h3>営業時間・定休日</h3>
          <div class="grid two">
            <label>営業時間（開始）
              <input id="openTime" type="time">
            </label>
            <label>営業時間（終了）
              <input id="closeTime" type="time">
            </label>
            <label>最終受付
              <input id="lastEntry" type="time">
            </label>
            <label>定休日
              <input id="closedDays" maxlength="100" placeholder="例：毎週火曜日">
            </label>
            <label class="full">営業時間の補足
              <textarea id="hoursNote" rows="2" maxlength="300" placeholder="例：季節により変更。詳細は公式サイトを確認"></textarea>
            </label>
          </div>
        </section>

        <section class="form-section">
          <h3>料金</h3>
          <div class="grid two">
            <label>大人料金（円）
              <input id="price" type="number" min="0" step="1" inputmode="numeric" placeholder="例：800">
            </label>
            <label>子ども料金（円）
              <input id="childPrice" type="number" min="0" step="1" inputmode="numeric" placeholder="例：400">
            </label>
            <label>その他料金（円）
              <input id="otherPrice" type="number" min="0" step="1" inputmode="numeric" placeholder="例：1200">
            </label>
            <label>料金区分
              <select id="priceType">
                <option value="">選択してください</option>
                <option value="入浴のみ">入浴のみ</option>
                <option value="入浴＋サウナ">入浴＋サウナ</option>
                <option value="入浴＋タオル">入浴＋タオル</option>
                <option value="その他">その他</option>
              </select>
            </label>
            <label class="full">料金の補足
              <textarea id="priceNote" rows="2" maxlength="300" placeholder="例：土日祝は大人1,000円、入湯税別"></textarea>
            </label>
          </div>
        </section>

        <section class="form-section">
          <h3>支払い方法</h3>
          <div class="checks">
            <label><input type="checkbox" name="payment" value="現金">現金</label>
            <label><input type="checkbox" name="payment" value="クレジットカード">クレジットカード</label>
            <label><input type="checkbox" name="payment" value="交通系IC">交通系IC</label>
            <label><input type="checkbox" name="payment" value="QRコード決済">QRコード決済</label>
            <label><input type="checkbox" name="payment" value="その他">その他</label>
          </div>
        </section>

        <section class="form-section">
          <h3>メモ</h3>
          <label>施設について
            <textarea id="note" rows="4" maxlength="1000" placeholder="温泉の特徴や注意事項など"></textarea>
          </label>
        </section>

        <button type="submit">登録する</button>
      </form></div></div>
<script src="app.js"></script></body></html>
