<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>温泉詳細 | 温泉データベース</title>
  <link rel="stylesheet" href="onsen-detail.css">
</head>
<body>

<header class="site-header">
  <a class="back-link" href="index.html">← 温泉一覧に戻る</a>
  <div class="brand">
    <span class="brand-icon">♨</span>
    <div>
      <b>温泉データベース</b>
      <small>みんなでつくる温泉情報</small>
    </div>
  </div>
</header>

<main class="detail-main">
  <div id="status" class="status">温泉情報を読み込んでいます…</div>

  <section id="detail" class="detail-card hidden">
    <div class="detail-top">
      <div>
        <span id="businessType" class="badge"></span>
        <h1 id="name">温泉名</h1>
        <p id="place" class="place"></p>
      </div>
    </div>

    <div id="basicSection" class="detail-section">
      <h2>基本情報</h2>
      <div id="basicInfo" class="info-grid"></div>
    </div>

    <div id="hoursSection" class="detail-section">
      <h2>営業時間・定休日</h2>
      <div id="hoursInfo" class="info-grid"></div>
    </div>

    <div id="priceSection" class="detail-section">
      <h2>利用・料金</h2>
      <div id="priceInfo" class="info-grid"></div>
    </div>

    <div id="officialSection" class="detail-section">
      <h2>公式情報・SNS</h2>
      <div id="officialInfo" class="link-list"></div>
    </div>

    <div id="bathSection" class="detail-section">
      <h2>お風呂・サウナ</h2>
      <div id="bathInfo" class="info-grid"></div>
    </div>

    <div id="equipmentSection" class="detail-section">
      <h2>設備</h2>
      <div id="equipmentInfo" class="info-grid"></div>
    </div>

    <div id="springSection" class="detail-section">
      <h2>泉質</h2>
      <div id="springInfo" class="info-grid"></div>
    </div>

    <div id="rentalSection" class="detail-section">
      <h2>レンタル品</h2>
      <div id="rentalInfo" class="tag-list"></div>
    </div>

    <div id="mapSection" class="detail-section">
      <h2>位置情報</h2>
      <div id="mapInfo"></div>
    </div>

    <div id="noteSection" class="detail-section">
      <h2>メモ・施設紹介</h2>
      <p id="note" class="long-text"></p>
    </div>
  </section>

  <section id="notFound" class="not-found hidden">
    <h2>温泉が見つかりませんでした</h2>
    <p>一覧画面からもう一度温泉を選んでください。</p>
    <a class="primary-link" href="index.html">温泉一覧に戻る</a>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="onsen-detail.js"></script>
</body>
</html>
